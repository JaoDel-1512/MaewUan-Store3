<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบสลิปโอนเงิน | Slip2Go</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white text-center">
            <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3 backdrop-blur-sm">
                <i class="fa-solid fa-file-invoice-dollar text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold">ตรวจสอบสลิปโอนเงิน</h1>
            <p class="text-blue-100 text-sm mt-1">อัปโหลดสลิปธนาคารเพื่อตรวจสอบความถูกต้อง (Slip2Go)</p>
        </div>

        <!-- Form Body -->
        <div class="p-6 space-y-5">
            <!-- Upload Area -->
            <div id="drop-area" class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-blue-500 transition-colors cursor-pointer bg-gray-50">
                <input type="file" id="slip-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                <div id="upload-placeholder" class="space-y-2">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-blue-500"></i>
                    <p class="text-sm font-medium text-gray-700">คลิก หรือ ลากไฟล์สลิปมาวางที่นี่</p>
                    <p class="text-xs text-gray-400">รองรับไฟล์ JPG, PNG</p>
                </div>
                <!-- Preview Area -->
                <div id="preview-container" class="hidden space-y-3">
                    <img id="image-preview" src="" alt="Slip Preview" class="max-h-60 mx-auto rounded-lg shadow-sm border">
                    <button type="button" onclick="removeImage()" class="text-xs text-red-500 hover:text-red-700 font-medium">
                        <i class="fa-solid fa-trash-can mr-1"></i> เปลี่ยนรูปภาพ
                    </button>
                </div>
            </div>

            <!-- Action Button -->
            <button id="btn-verify" onclick="verifySlip()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fa-solid fa-shield-halved"></i>
                <span>ตรวจสอบสลิป</span>
            </button>

            <!-- Result Status Area -->
            <div id="result-box" class="hidden rounded-xl p-4 border text-sm">
                <!-- Content generated via JS -->
            </div>
        </div>

        <!-- Footer -->
        <div class="bg-gray-50 px-6 py-3 border-t border-gray-100 text-center text-xs text-gray-400">
            Powered by Slip2Go API Validation System
        </div>
    </div>

    <script>
        let selectedFile = null;

        // Trigger File Input Click
        document.getElementById('drop-area').addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'I') {
                document.getElementById('slip-input').click();
            }
        });

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('upload-placeholder').classList.add('hidden');
                    document.getElementById('preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
                hideResult();
            }
        }

        function removeImage() {
            selectedFile = null;
            document.getElementById('slip-input').value = '';
            document.getElementById('upload-placeholder').classList.remove('hidden');
            document.getElementById('preview-container').classList.add('hidden');
            hideResult();
        }

        function hideResult() {
            const resultBox = document.getElementById('result-box');
            resultBox.classList.add('hidden');
            resultBox.className = 'hidden rounded-xl p-4 border text-sm';
        }

        async function verifySlip() {
            if (!selectedFile) {
                alert('กรุณาเลือกรูปภาพสลิปก่อนทำการตรวจสอบ');
                return;
            }

            const btn = document.getElementById('btn-verify');
            const resultBox = document.getElementById('result-box');
            
            // Loading State
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>กำลังตรวจสอบ...</span>`;
            hideResult();

            // Prepare FormData for Slip2Go API
            const formData = new FormData();
            formData.append('files', selectedFile);

            try {
                // ตัวอย่างการยิง API ไปยัง Slip2Go
                // *หมายเหตุ*: หากต้องการใส่ API SecretKey ควรทำผ่าน Backend หรือ Worker เพื่อความปลอดภัย
                const response = await fetch('https://api.slip2go.com/api/verify', {
                    method: 'POST',
                    headers: {
                        // 'x-api-key': 'YOUR_SLIP2GO_API_KEY' // ใส่ Key ของ Slip2Go ที่นี่
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // แสดงผลสำเร็จ
                    resultBox.className = 'rounded-xl p-4 border text-sm bg-green-50 border-green-200 text-green-800 space-y-2';
                    resultBox.innerHTML = `
                        <div class="flex items-center font-semibold text-green-700">
                            <i class="fa-solid fa-circle-check text-lg mr-2"></i> สลิปถูกต้อง
                        </div>
                        <div class="text-xs space-y-1 pt-1 border-t border-green-200">
                            <p><strong>ผู้โอน:</strong> ${data.data?.sender?.name || '-'}</p>
                            <p><strong>จำนวนเงิน:</strong> ${data.data?.amount || 0} บาท</p>
                            <p><strong>วันที่:</strong> ${data.data?.transDate || '-'} ${data.data?.transTime || ''}</p>
                        </div>
                    `;
                } else {
                    // แสดงข้อผิดพลาด
                    resultBox.className = 'rounded-xl p-4 border text-sm bg-red-50 border-red-200 text-red-800 space-y-1';
                    resultBox.innerHTML = `
                        <div class="flex items-center font-semibold text-red-700">
                            <i class="fa-solid fa-circle-xmark text-lg mr-2"></i> ไม่พบข้อมูลสลิป หรือสลิปไม่ถูกต้อง
                        </div>
                        <p class="text-xs text-red-600">${data.message || 'กรุณาตรวจสอบรูปภาพอีกครั้ง'}</p>
                    `;
                }
            } catch (error) {
                // กรณีเกิด Error ในการเชื่อมต่อ API
                resultBox.className = 'rounded-xl p-4 border text-sm bg-amber-50 border-amber-200 text-amber-800 space-y-1';
                resultBox.innerHTML = `
                    <div class="flex items-center font-semibold text-amber-700">
                        <i class="fa-solid fa-triangle-exclamation text-lg mr-2"></i> เกิดข้อผิดพลาดในการเชื่อมต่อ
                    </div>
                    <p class="text-xs text-amber-600">ไม่สามารถเชื่อมต่อระบบ Slip2Go ได้ในขณะนี้</p>
                `;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-shield-halved"></i><span>ตรวจสอบสลิป</span>`;
                resultBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
